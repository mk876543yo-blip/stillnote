<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f5f9">
  <meta name="description" content="A private desktop workspace for notes, ideas, and study. Saved on your computer.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>Stillnote — notes that stay yours</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#notes" aria-label="Stillnote home">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M23 9.7c-1.2-1-2.8-1.5-4.8-1.5h-2a4.4 4.4 0 0 0 0 8.8h2a4.4 4.4 0 1 1 0 8.8h-2c-2 0-3.6-.5-4.8-1.5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg></span>
        <span class="brand-copy"><strong>stillnote</strong><small>LOCAL NOTES</small></span>
      </a>

      <button class="new-note-button" id="new-note-button"><span class="plus-mark">＋</span><span>New note</span><kbd>Ctrl N</kbd></button>

      <nav class="primary-nav" aria-label="Main navigation">
        <button class="nav-item is-active" data-view="notes"><span class="nav-icon">▤</span><span>Notes</span><span class="nav-count" id="notes-count">0</span></button>
        <button class="nav-item" data-view="flashcards"><span class="nav-icon">▣</span><span>Flashcards</span><span class="nav-count" id="cards-count">0</span></button>
        <button class="nav-item" data-view="focus"><span class="nav-icon">◷</span><span>Focus room</span></button>
        <button class="nav-item" data-view="insights"><span class="nav-icon">▥</span><span>Study insights</span></button>
      </nav>

      <div class="sidebar-section-heading">
        <span>COLLECTIONS</span>
        <button class="icon-button tiny" id="add-folder-button" aria-label="Add a collection" title="Add a collection">＋</button>
      </div>
      <div class="folder-list" id="folder-list"></div>
      <div class="sidebar-spacer"></div>
      <button class="nav-item trash-link" data-view="trash"><span class="nav-icon">⌑</span><span>Recently deleted</span></button>
      <button class="nav-item settings-link" id="settings-button"><span class="nav-icon">⚙</span><span>Settings</span></button>
      <div class="privacy-note"><span class="privacy-dot"></span><span>Private on this device</span></div>
    </aside>

    <main class="main-shell">
      <header class="topbar">
        <div class="crumbs"><span class="crumb-dot"></span><span id="topbar-context">My workspace</span><span class="crumb-separator">/</span><strong id="topbar-view">Notes</strong></div>
        <div class="topbar-actions">
          <button class="search-trigger" id="search-open" aria-label="Browse notes"><span class="search-glyph">⌕</span><span>Browse notes</span><kbd>Ctrl K</kbd></button>
          <button class="icon-button top-icon" id="theme-toggle" aria-label="Cycle color theme" title="Cycle color theme"><span id="theme-icon">◐</span></button>
          <button class="avatar-button" id="profile-button" aria-label="Open settings">M</button>
        </div>
      </header>
      <div id="workspace" class="workspace" aria-live="polite"></div>
    </main>
  </div>

  <div id="overlay-root"></div>
  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script src="app.js"></script>
</body>
</html>
